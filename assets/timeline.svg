<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="40" y1="20" x2="1160" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.52" stop-color="#151022"/>
      <stop offset="1" stop-color="#07150D"/>
    </linearGradient>
    <linearGradient id="neon" x1="600" y1="128" x2="600" y2="616" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A855F7"/>
      <stop offset="0.52" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#39FF14"/>
    </linearGradient>
    <linearGradient id="cardPurple" x1="70" y1="0" x2="535" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#23103B"/>
      <stop offset="1" stop-color="#151022"/>
    </linearGradient>
    <linearGradient id="cardGreen" x1="665" y1="0" x2="1130" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101D18"/>
      <stop offset="1" stop-color="#0D1712"/>
    </linearGradient>
    <filter id="purpleGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feFlood flood-color="#A855F7" flood-opacity="0.85"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="greenGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feFlood flood-color="#39FF14" flood-opacity="0.85"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .title { font: 700 34px 'Segoe UI', Ubuntu, sans-serif; letter-spacing: 4px; fill: #FFFFFF; }
      .subtitle { font: 500 17px 'Segoe UI', Ubuntu, sans-serif; letter-spacing: 1.5px; fill: #AFA5C7; }
      .year { font: 800 21px 'Segoe UI', Ubuntu, sans-serif; letter-spacing: 1px; fill: #39FF14; }
      .event-title { font: 700 20px 'Segoe UI', Ubuntu, sans-serif; fill: #FFFFFF; }
      .event-text { font: 400 15px 'Segoe UI', Ubuntu, sans-serif; fill: #B9C0CC; }
      .line { stroke-dasharray: 700; stroke-dashoffset: 0; animation: draw 3.8s ease-out backwards; }
      .event { opacity: 1; animation: reveal .8s cubic-bezier(.2,.8,.2,1) backwards; }
      .e1 { animation-delay: .45s; }
      .e2 { animation-delay: 1.05s; }
      .e3 { animation-delay: 1.65s; }
      .e4 { animation-delay: 2.25s; }
      .e5 { animation-delay: 2.85s; }
      .node { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-in-out infinite; }
      .n2 { animation-delay: .4s; } .n3 { animation-delay: .8s; }
      .n4 { animation-delay: 1.2s; } .n5 { animation-delay: 1.6s; }
      .star { transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
      .s2 { animation-delay: .7s; } .s3 { animation-delay: 1.3s; }
      .s4 { animation-delay: 1.9s; } .s5 { animation-delay: .35s; }
      @keyframes draw { from { stroke-dashoffset: 700; } to { stroke-dashoffset: 0; } }
      @keyframes reveal { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes pulse { 0%,100% { transform: scale(.86); opacity: .72; } 50% { transform: scale(1.25); opacity: 1; } }
      @keyframes twinkle { 0%,100% { opacity: .22; transform: scale(.65) rotate(0deg); } 50% { opacity: 1; transform: scale(1.2) rotate(45deg); } }
    </style>
  </defs>

  <rect x="18" y="18" width="1164" height="684" rx="34" fill="url(#background)" stroke="#6D28D9" stroke-width="2"/>
  <rect x="28" y="28" width="1144" height="664" rx="28" stroke="#39FF14" stroke-opacity="0.12"/>

  <g class="star" filter="url(#purpleGlow)"><path d="M86 75L90 86L101 90L90 94L86 105L82 94L71 90L82 86L86 75Z" fill="#A855F7"/></g>
  <g class="star s2" filter="url(#greenGlow)"><path d="M1104 82L1108 93L1119 97L1108 101L1104 112L1100 101L1089 97L1100 93L1104 82Z" fill="#39FF14"/></g>
  <g class="star s3"><circle cx="1038" cy="57" r="3" fill="#A855F7"/></g>
  <g class="star s4"><circle cx="156" cy="636" r="4" fill="#39FF14"/></g>
  <g class="star s5"><path d="M1090 628L1093 636L1101 639L1093 642L1090 650L1087 642L1079 639L1087 636L1090 628Z" fill="#A855F7"/></g>

  <text x="600" y="72" text-anchor="middle" class="title">CONSTELAÇÃO DE CONQUISTAS</text>
  <text x="600" y="101" text-anchor="middle" class="subtitle">UMA JORNADA CONSTRUÍDA ENTRE CÓDIGO, LIDERANÇA E IMPACTO</text>

  <path class="line" d="M600 140C568 194 632 236 600 286C568 336 632 382 600 430C568 478 632 526 600 604" stroke="url(#neon)" stroke-width="5" stroke-linecap="round"/>
  <circle r="7" fill="#FFFFFF" filter="url(#greenGlow)">
    <animateMotion dur="6.5s" repeatCount="indefinite" path="M600 140C568 194 632 236 600 286C568 336 632 382 600 430C568 478 632 526 600 604"/>
  </circle>

  <g class="event e1" filter="url(#softShadow)">
    <rect x="62" y="130" width="470" height="88" rx="18" fill="url(#cardPurple)" stroke="#7C3AED"/>
    <text x="88" y="160" class="year">2023</text>
    <text x="88" y="185" class="event-title">FINALISTA DE REGIONAL FLL</text>
    <text x="88" y="205" class="event-text">Primeiro grande resultado competitivo como líder</text>
    <path d="M532 174H584" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 5"/>
  </g>
  <g class="event e1"><circle class="node" cx="600" cy="174" r="11" fill="#A855F7" filter="url(#purpleGlow)"/><circle cx="600" cy="174" r="4" fill="#FFFFFF"/></g>

  <g class="event e2" filter="url(#softShadow)">
    <rect x="668" y="230" width="470" height="88" rx="18" fill="url(#cardGreen)" stroke="#22C55E"/>
    <text x="694" y="260" class="year">2024</text>
    <text x="694" y="285" class="event-title">SEMIFINALISTA DE REGIONAL</text>
    <text x="694" y="305" class="event-text">Evolução técnica, estratégia e trabalho em equipe</text>
    <path d="M616 274H668" stroke="#22C55E" stroke-width="2" stroke-dasharray="5 5"/>
  </g>
  <g class="event e2"><circle class="node n2" cx="600" cy="274" r="11" fill="#39FF14" filter="url(#greenGlow)"/><circle cx="600" cy="274" r="4" fill="#FFFFFF"/></g>

  <g class="event e3" filter="url(#softShadow)">
    <rect x="62" y="330" width="470" height="88" rx="18" fill="url(#cardPurple)" stroke="#7C3AED"/>
    <text x="88" y="360" class="year">2025</text>
    <text x="88" y="385" class="event-title">SUSTAINABILITY AWARD</text>
    <text x="88" y="405" class="event-text">Impacto da equipe além do desempenho na arena</text>
    <path d="M532 374H584" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 5"/>
  </g>
  <g class="event e3"><circle class="node n3" cx="600" cy="374" r="11" fill="#A855F7" filter="url(#purpleGlow)"/><circle cx="600" cy="374" r="4" fill="#FFFFFF"/></g>

  <g class="event e4" filter="url(#softShadow)">
    <rect x="668" y="430" width="470" height="88" rx="18" fill="url(#cardGreen)" stroke="#22C55E"/>
    <text x="694" y="460" class="year">2023 — 2026</text>
    <text x="694" y="485" class="event-title">FRC • FLL • FTC • OBR</text>
    <text x="694" y="505" class="event-text">Experiência em quatro níveis da robótica competitiva</text>
    <path d="M616 474H668" stroke="#22C55E" stroke-width="2" stroke-dasharray="5 5"/>
  </g>
  <g class="event e4"><circle class="node n4" cx="600" cy="474" r="11" fill="#39FF14" filter="url(#greenGlow)"/><circle cx="600" cy="474" r="4" fill="#FFFFFF"/></g>

  <g class="event e5" filter="url(#softShadow)">
    <rect x="216" y="550" width="768" height="96" rx="22" fill="#171125" stroke="url(#neon)" stroke-width="2"/>
    <text x="600" y="583" text-anchor="middle" class="year">IMPACTO</text>
    <text x="600" y="611" text-anchor="middle" class="event-title">600+ HORAS • 30+ ALUNOS</text>
    <text x="600" y="633" text-anchor="middle" class="event-text">Mentorias, aulas, workshops e ações sociais com tecnologia</text>
  </g>
  <g class="event e5"><circle class="node n5" cx="600" cy="574" r="12" fill="#39FF14" opacity="0"/></g>

  <text x="600" y="677" text-anchor="middle" class="subtitle">✦ WE ARE ALL MADE OF STARDUST ✦</text>
</svg>
